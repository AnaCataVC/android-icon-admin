name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Pre-fetch Gradle Wrapper
        run: |
          DIST_DIR="$HOME/.gradle/wrapper/dists/gradle-8.10.2-bin/a04bxjujx95o3nb99gddekhwo"
          mkdir -p "$DIST_DIR"
          if [ ! -f "$DIST_DIR/gradle-8.10.2-bin.zip" ] || ! unzip -tq "$DIST_DIR/gradle-8.10.2-bin.zip" 2>/dev/null; then
            echo "Downloading gradle-8.10.2-bin.zip..."
            curl -sSL --retry 3 -o "$DIST_DIR/gradle-8.10.2-bin.zip" "https://mirrors.cloud.tencent.com/gradle/gradle-8.10.2-bin.zip"
            unzip -tq "$DIST_DIR/gradle-8.10.2-bin.zip"
          fi

      - name: Run Core Cleanroom JVM Tests
        run: |
          ./gradlew :core:test --info || (echo "Retrying :core:test..." && sleep 15 && ./gradlew :core:test --info)

      - name: Assemble Debug APK
        run: |
          ./gradlew :app:assembleDebug || (echo "Retrying :app:assembleDebug..." && sleep 15 && ./gradlew :app:assembleDebug)

      - name: Configure Release Keystore
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p keystore
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > keystore/release.keystore

      - name: Assemble Release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/keystore/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease || (echo "Retrying :app:assembleRelease..." && sleep 15 && ./gradlew :app:assembleRelease)
          mkdir -p release-artifacts
          TAG_VERSION="${GITHUB_REF_NAME:-v0.1.2}"
          for apk in app/build/outputs/apk/release/*.apk; do
            if [ -f "$apk" ]; then
              cp "$apk" "release-artifacts/AndroidIconsAdmin-${TAG_VERSION}.apk"
              break
            fi
          done

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: release-artifacts/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          NOTES_FILE="RELEASE_NOTES_${TAG_NAME}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            NOTES_FILE="RELEASE_NOTES_v0.1.1.md"
          fi
          gh release create "$TAG_NAME" release-artifacts/*.apk \
            --title "AndroidIconsAdmin $TAG_NAME" \
            --notes-file "$NOTES_FILE"
