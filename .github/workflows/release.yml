name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Core Cleanroom JVM Tests
        run: ./gradlew :core:test --info

      - name: Configure Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > keystore/release.keystore
          fi

      - name: Assemble Release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/keystore/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Clean up Keystore
        if: always()
        run: rm -rf keystore/

      - name: Package Release Assets & Checksum
        run: |
          TAG_NAME="${{ github.ref_name }}"
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          
          if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
            echo "Error: Release APK not found in app/build/outputs/apk/release"
            exit 1
          fi
          
          APK_DEST="AndroidIconsAdmin-${TAG_NAME}.apk"
          cp "$APK_SRC" "$APK_DEST"
          sha256sum "$APK_DEST" > "${APK_DEST}.sha256"
          
          echo "ASSET_APK=$APK_DEST" >> $GITHUB_ENV
          echo "ASSET_SHA=${APK_DEST}.sha256" >> $GITHUB_ENV

      - name: Upload Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET_APK }}
            ${{ env.ASSET_SHA }}
          draft: false
          prerelease: false
          generate_release_notes: true
